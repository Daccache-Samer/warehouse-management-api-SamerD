name: CI

on:
  push:
    branches: [ main, 'session-**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push-image:
    name: Build and push warehouse-api image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: warehouse-management-api
          file: warehouse-management-api/Warehouse.Presentation/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
